    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#121318" />
    <!-- Dark studio from the first paint (no light flash before CSS/React).
         valdis.protu.lv uses the same index.html but stays light. -->
    <script>
      if ('%MODE%' === 'valdis' || location.hostname.indexOf('valdis.') === 0) {
        document.documentElement.classList.add('site-valdis')
        document.querySelector('meta[name="color-scheme"]').content = 'light'
        document.querySelector('meta[name="theme-color"]').content = '#e9eaed'
      }
      // Shader spotlight will load: hide the static CSS cone from the first paint,
      // so the beam switches on instead of swapping. LightRays clears this if WebGL fails.
      try {
        if ('WebGLRenderingContext' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.setAttribute('data-rays', 'pending')
        }
      } catch (e) {}
      // index.html doubles as the fallback for paths that were not prerendered (e.g. /darbi/silva):
      // then its prerendered Home must not show; React draws the right page (App removes the class).
      try {
        var built = document.head.getAttribute('data-path')
        var trim = function (p) { return p.length > 1 && p.charAt(p.length - 1) === '/' ? p.slice(0, -1) : p }
        if (built && trim(built) !== trim(location.pathname)) document.documentElement.classList.add('spa-fallback')
      } catch (e) {}
      // Home is prerendered in Latvian. A visitor who will see English gets its images at once, but the
      // Latvian text stays invisible until React switches to English (App removes the class). Home only:
      // on text-led pages (Pakalpojumi, services) hiding the text would delay their main content.
      try {
        if (location.pathname === '/' && document.head.getAttribute('data-path') === '/') {
          var q = new URLSearchParams(location.search).get('lang')
          var saved = null
          try { saved = localStorage.getItem('protu-lang') } catch (e) {}
          // Same rule as App.tsx initialLang: no ?lang and no saved choice = Latvian (never browser language).
          var lang = q === 'lv' || q === 'en' ? q : saved === 'lv' || saved === 'en' ? saved : 'lv'
          if (lang !== 'lv') document.documentElement.classList.add('lang-swap')
        }
      } catch (e) {}
      // Failsafe: if the app can't run (a script fails to load, or a very slow or broken network),
      // show the prerendered page as it is rather than leaving its text or content hidden.
      (function () {
        var release = function () { document.documentElement.classList.remove('lang-swap', 'spa-fallback') }
        // Only the app's own scripts (/assets/), not e.g. an ad-blocked analytics script.
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && t.tagName === 'SCRIPT' && (t.getAttribute('src') || '').indexOf('/assets/') !== -1) release()
        }, true)
        setTimeout(release, 10000)
      })()
    </script>
    <script nomodule>document.documentElement.classList.remove('lang-swap', 'spa-fallback')</script>

      html.lang-swap #root * { color: transparent !important; -webkit-text-fill-color: transparent !important; text-shadow: none !important; }
